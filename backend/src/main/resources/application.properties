spring.application.name=rideflow-backend

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/rideflow
spring.datasource.username=${RIDEFLOW_DB_USERNAME}
spring.datasource.password=${RIDEFLOW_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
rideflow.jwt.secret=${RIDEFLOW_JWT_SECRET}